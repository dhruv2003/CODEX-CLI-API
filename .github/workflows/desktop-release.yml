name: Desktop installers and draft staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag (vX.Y.Z)
        type: string
        required: true
      mode:
        description: Artifacts tests installers; signed-draft stages both platforms and updater manifest
        type: choice
        options: [artifacts, signed-draft]
        default: artifacts
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos-arm64
            bundles: app
          - runner: windows-latest
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag, source versions and signing policy
        run: |
          node scripts/release-assets.mjs validate --tag "$RELEASE_TAG"
          node scripts/release-policy.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.mode == 'signed-draft' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:release
      - run: npm run desktop:prepare
      - run: npm run desktop:check
      - name: Build desktop installer and optional updater signature
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.mode == 'signed-draft' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.mode == 'signed-draft' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: --bundles ${{ matrix.bundles }} --config .desktop-cache/release.conf.json
          uploadUpdaterJson: false
      - name: Package macOS DMG with README and Applications shortcut
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          npm run desktop:dmg -- --skip-build
      - name: Retain installers for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ inputs.tag }}-${{ inputs.mode }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig

  stage-draft:
    if: inputs.mode == 'signed-draft'
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-${{ inputs.tag }}-${{ inputs.mode }}
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-${{ inputs.tag }}-${{ inputs.mode }}
          path: release/macos
      - name: Validate source and create or find draft
        run: node scripts/release-assets.mjs validate --tag "$RELEASE_TAG"
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && !existing.draft) throw new Error('Refusing to modify a published release.');
            if (!existing) {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `Codex CLI API ${tag}`,
                draft: true, prerelease: false,
                body: 'Draft staging only. Review and test both platforms before manually publishing. Updater signatures authenticate updates; macOS is ad-hoc signed and not notarized, and Windows is not Authenticode signed.'
              });
            }
      - name: Stage Windows installer and signature in draft only
        shell: bash
        run: |
          mapfile -d '' installers < <(find release/windows -type f -name '*.exe' -print0)
          test "${#installers[@]}" -eq 1
          test -f "${installers[0]}.sig"
          node scripts/release-assets.mjs stage --tag "$RELEASE_TAG" --platform windows-x86_64 --artifact "${installers[0]}" --artifact "${installers[0]}.sig" --repo "$GH_REPO"
      - name: Stage macOS DMG and signed updater archive in draft only
        shell: bash
        run: |
          mapfile -d '' images < <(find release/macos -type f -name '*.dmg' -print0)
          mapfile -d '' archives < <(find release/macos -type f -name '*.app.tar.gz' -print0)
          test "${#images[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}.sig"
          node scripts/release-assets.mjs stage --tag "$RELEASE_TAG" --platform darwin-aarch64 --artifact "${images[0]}" --artifact "${archives[0]}" --artifact "${archives[0]}.sig" --repo "$GH_REPO"
      - name: Finalize combined updater manifest and checksums in draft only
        run: node scripts/release-assets.mjs finalize --tag "$RELEASE_TAG" --repo "$GH_REPO"
